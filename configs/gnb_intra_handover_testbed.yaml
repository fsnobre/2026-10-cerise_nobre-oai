# =============================================================================
# Delta Config: Intra-gNB Handover (Testbed)
# =============================================================================
# BASE: gnb_annotated.yaml (monolithic, Band 78, 106 PRB, USRP X310)
# This file shows ONLY the parameters that are added or changed for
# intra-gNB A3-triggered handover.
#
# Topology:
#   One nr-softmodem process on WS-gnb1
#   Two cells: physCellId=0 (serving) and physCellId=1 (target)
#   Both served by the same X310 (or two X310s if available)
#
# Apply by merging these blocks into your base gnb_annotated.yaml.
# =============================================================================

# In the gNBs[] entry, add these parameters alongside existing ones:
gNBs:
  - gNB_ID: 0xe00                   # unchanged from base
    # ... (all existing parameters from base config) ...

    # -------------------------------------------------------------------------
    # MEASUREMENT CONFIGURATION — added for handover
    # Without do_MeasurementConfig: 1, OAI sends no MeasConfig to UEs
    # and no A3 reports will ever arrive at the gNB.
    # -------------------------------------------------------------------------
    do_MeasurementConfig: 1         # NEW: enable measurement config in RRCReconfiguration

    # A3 event parameters — tune based on observed RSRP delta between your two cells.
    # Lab starting point: a3Offset=4 (2dB), hysteresis=2 (1dB), TTT=160ms.
    # If no HO occurs: reduce a3Offset. If ping-pong: increase hysteresis.
    measurement_events:
      - A3

    A3_event:
      a3Offset: 4           # RSRP offset (dB×2): 4 = 2 dB. Range: -30 to 30.
      hysteresis: 2         # Hysteresis (dB×2): 2 = 1 dB. Prevents ping-pong.
      timeToTrigger: 160    # ms condition must persist: 160ms. Reduce to 64 for faster HO.
      reportAmount: 1       # Number of reports: 1 is fine for basic HO.
      reportOnLeave: 0      # 0: don't report when condition leaves. Avoids re-triggering.

    # -------------------------------------------------------------------------
    # NEIGHBOR CELL LIST — required for UE to know what to measure
    # physCellId must match the target cell's actual physCellId.
    # absoluteFrequencySSB must match the target cell's SSB broadcast.
    # For intra-gNB: Cell 1 on same gNB.
    # -------------------------------------------------------------------------
    neighbour_cell_configuration:
      - physCellId: 1                       # Target cell physCellId
        absoluteFrequencySSB: 640704        # Same ARFCN if same frequency, different if not
        dl_subcarrierSpacing: 1             # Group B: must match target cell SCS
        dl_frequencyBand: 78

    # -------------------------------------------------------------------------
    # HANDOVER TIMERS
    # T304: time UE has to complete RACH on target cell after HandoverCommand.
    # Start with 2000ms for lab, reduce to 1000ms once stable.
    # -------------------------------------------------------------------------
    T304: 2000              # ms. UE must complete RACH on target within this time.
    T310: 1000              # ms. Radio link failure detection timer.
    N310: 6                 # Out-of-sync count before T310 starts.
    N311: 2                 # In-sync count to stop T310.

    # -------------------------------------------------------------------------
    # SECOND CELL CONFIGURATION (intra-gNB only)
    # Add a second entry in servingCellConfigCommon for Cell 1.
    # Cell 1 uses same frequency as Cell 0 in this example (different physCellId).
    # For different frequency: change absoluteFrequencySSB and frequencyPointA.
    # -------------------------------------------------------------------------
    servingCellConfigCommon:
      # Cell 0 (existing — unchanged)
      - physCellId: 0
        # ... (all existing Cell 0 parameters from base config) ...

      # Cell 1 (new — added for intra-gNB HO)
      - physCellId: 1                   # Must differ from Cell 0
        absoluteFrequencySSB: 640704    # Same freq as Cell 0 (same carrier, different PCI)
        dl_absoluteFrequencyPointA: 639996
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1
        dl_carrierBandwidth: 106
        initialDLBWPlocationAndBandwidth: 28875
        initialDLBWPsubcarrierSpacing: 1
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: 78
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1
        ul_carrierBandwidth: 106
        pMax: 20
        initialULBWPlocationAndBandwidth: 28875
        initialULBWPsubcarrierSpacing: 1
        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 2      # Different from Cell 0 to avoid preamble collision
        msg1_SubcarrierSpacing: 1
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        pucchGroupHopping: 0
        hoppingId: 41                   # Different from Cell 0 (was 40)
        p0_nominal: -90
        ssb_PositionsInBurst_PR: 2
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1
        referenceSubcarrierSpacing: 1
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4
        ssPBCH_BlockPower: -25

# MACRLCs, L1s, RUs, THREAD_STRUCT, security — unchanged from base config
