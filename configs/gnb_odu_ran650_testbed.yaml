# =============================================================================
# OAI O-DU Configuration — Benetel RAN650 (Testbed Specific)
# =============================================================================
# Host:        WS-gnb2
# Fronthaul:   192.168.50.1 (dedicated NIC) → Benetel RAN650
# Core:        192.168.70.129 (demo-oai) → AMF at 192.168.70.132
# PTP:         Falcon RX/812/G → G.8275.1 on fronthaul NIC
# Band:        78 · 40 MHz · 30 kHz SCS · 106 PRB · 4T4R
# =============================================================================

Active_gNBs:
  - gnb-odu
Asn1_verbosity: none

gNBs:
  - gNB_ID: 0xe00
    gNB_name: gnb-odu
    tracking_area_code: 1
    nr_cellid: 12345678

    plmn_list:
      - mcc: 001
        mnc: 01
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0x00001
          - sst: 1
            sd: 0x000002

    min_rxtxtime: 6
    pdsch_AntennaPorts: 4           # 4T4R — Benetel RAN650
    pusch_AntennaPorts_XP: 4
    do_SRS: 1
    do_CSIRS: 1

    servingCellConfigCommon:
      - physCellId: 0               # Must match Benetel cell ID setting
        absoluteFrequencySSB: 640704
        dl_absoluteFrequencyPointA: 639996
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1
        dl_carrierBandwidth: 106    # Group A: 40 MHz @ 30 kHz SCS
        initialDLBWPlocationAndBandwidth: 28875
        initialDLBWPsubcarrierSpacing: 1
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: 78
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1
        ul_carrierBandwidth: 106
        pMax: 20
        initialULBWPlocationAndBandwidth: 28875
        initialULBWPsubcarrierSpacing: 1
        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90
        ssb_PositionsInBurst_PR: 2
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1
        referenceSubcarrierSpacing: 1
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4
        ssPBCH_BlockPower: -25

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    amf_ip_address:
      - ipv4: 192.168.70.132

    NETWORK_INTERFACES:
      GNB_INTERFACE_NAME_FOR_NG_AMF: demo-oai
      GNB_IPV4_ADDRESS_FOR_NG_AMF: 192.168.70.129
      GNB_INTERFACE_NAME_FOR_NGU: demo-oai
      GNB_IPV4_ADDRESS_FOR_NGU: 192.168.70.129
      GNB_PORT_FOR_S1U: 2152

MACRLCs:
  - tr_s_preference: local_L1
    tr_n_preference: local_RRC
    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    ul_prbblack_SNR_threshold: 10
    ulsch_max_frame_inactivity: 5
    SliceConf: "/home/nobre/oranslice2/ORANSlice/rrmPolicy.json"

L1s:
  - tr_n_preference: local_mac
    prach_dtx_threshold: 120
    pucch0_dtx_threshold: 100
    odfm_offset_divisor: 8
    pusch_proc_threads: 8

RUs:
  - local_rf: no                    # No USRP on WS-gnb2 in O-RAN mode
    nb_tx: 4
    nb_rx: 4
    att_tx: 0
    att_rx: 0
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75
    eNB_instances: [0]
    # sdr_addrs: ABSENT — no USRP

    ru_config:
      ru_type: oai_oran

      # Group M: compression must match Benetel RAN650 configuration exactly.
      # Verify in Benetel web UI / SSH: compression = BFP, bitwidth = 9.
      dl_compr_meth: 1              # BFP
      dl_compr_iq_bitwidth: 9
      ul_compr_meth: 1              # BFP
      ul_compr_iq_bitwidth: 9
      prach_compr_meth: 1
      prach_compr_iq_bitwidth: 9
      dl_compr_bias_compensation: 0
      ul_compr_bias_compensation: 0

    fh_conf:
      # Group N: get actual MACs before each run:
      #   O-DU MAC: ip link show <fh_iface> | grep ether
      #   Benetel MAC: label on unit, or: arping -I <fh_iface> -c 3 192.168.50.2
      du_addr: <WS-gnb2_FH_NIC_MAC>    # Group N: WS-gnb2 fronthaul NIC MAC
      ru_addr: <BENETEL_RAN650_MAC>     # Group N: Benetel RAN650 fronthaul port MAC

      mtu_size: 9000                    # Group Q: must match NIC (set: ip link set <fh_iface> mtu 9000)
      vlan_tag_strip: 0                 # 0=no strip. Set 1 if Benetel uses VLAN-tagged eCPRI.
      io_core: 4                        # Fronthaul I/O core. Keep away from --thread-pool cores.
      io_sleep: 0                       # Busy-poll for lowest latency.
      io_worker: 1

      # Timing windows tuned for Benetel RAN650, direct cable / single switch hop,
      # with Falcon RX/812/G as PTP grandmaster (G.8275.1).
      # If [FH] Timing violation appears: increase T1a_max_up/T2a_max_up in 50µs steps.
      T1a_max_up: 430
      T1a_min_up: 258
      T1a_max_cp_dl: 430
      T1a_min_cp_dl: 285
      T2a_max_up: 430
      T2a_min_up: 25
      T2a_max_cp_dl: 430
      T2a_min_cp_dl: 25
      Ta3_max: 300
      Ta3_min: 25
      T4a_max: 300
      T4a_min: 25

THREAD_STRUCT:
  - parallel_config: PARALLEL_RU_L1_TRX_SPLIT
    worker_config: WORKER_ENABLE

security:
  ciphering_algorithms: [nea0]
  integrity_algorithms: [nia2, nia0]
  drb_ciphering: yes
  drb_integrity: no

log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: debug
  f1ap_log_level: info
