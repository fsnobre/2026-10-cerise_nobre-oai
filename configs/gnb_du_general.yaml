# =============================================================================
# OAI gNB DU Configuration — General Template
# =============================================================================
# This is the DU side of an F1-split gNB deployment.
# The DU owns: PHY (L1), Lower MAC (L2 lower), RF (USRP X310), SIB1 broadcast.
# The DU does NOT own: RRC, N2, N3, AMF connection, UPF connection.
#
# Key differences from monolithic gNB config:
#   [SPLIT-1]  MACRLCs.tr_n_preference = "f1"         (was "local_RRC")
#   [SPLIT-2]  F1 address parameters added to MACRLCs
#   [SPLIT-3]  gNB_DU_ID added (required, absent in monolithic)
#   [SPLIT-4]  tracking_area_code ABSENT (DU has no AMF connection)
#   [SPLIT-5]  amf_ip_address ABSENT (DU has no N2)
#   [SPLIT-6]  NETWORK_INTERFACES for N2/N3 ABSENT (DU has no core connectivity)
#   [SPLIT-7]  F1AP block ABSENT on DU (CU listens; DU connects)
#   [SPLIT-8]  local_rf = yes and sdr_addrs present (RF is on DU host)
#   [SPLIT-9]  THREAD_STRUCT required (DU runs real-time PHY)
#
# Launch order: start CU first, wait for F1AP listening, then start DU.
# =============================================================================

Active_gNBs:
  - gnb-du
Asn1_verbosity: none

# =============================================================================
# SECTION 1: DU IDENTITY
# gNB_ID and nr_cellid MUST be identical to CU config. [Group K]
# gNB_DU_ID is new here — absent in monolithic and CU configs. [SPLIT-3]
# tracking_area_code is ABSENT — DU does not connect to AMF. [SPLIT-4]
# =============================================================================
gNBs:
  - gNB_ID: 0xe00               # Must match CU config exactly. [Group K]
    gNB_DU_ID: 1                # [SPLIT-3] Required. Unique ID for this DU within the gNB.
                                #           Range: 0 to 2^36-1. Use 1 for single-DU setups.
                                #           Each DU must have a different gNB_DU_ID.
    gNB_DU_name: gnb-du         # Optional. Human-readable DU name.
    gNB_name: gnb-du            # OAI also uses this for process identification.
    # tracking_area_code: ABSENT [SPLIT-4] — DU has no AMF connection.
    nr_cellid: 12345678          # Must match CU config exactly. [Group K]

    # plmn_list must match CU config exactly. [Group K]
    plmn_list:
      - mcc: 001
        mnc: 01
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0x00001

    # -------------------------------------------------------------------------
    # Cell physical parameters — DU broadcasts SIB1, handles RACH and PHY.
    # All Groups A-I from the base reference apply here.
    # Values must be consistent with CU servingCellConfigCommon.
    # -------------------------------------------------------------------------
    min_rxtxtime: 6              # Slots between RX and TX. 6 for 10GbE X310, 8 for 1GbE.
    do_SRS: 1
    do_CSIRS: 1
    pdsch_AntennaPorts: 1
    pusch_AntennaPorts_XP: 1

    servingCellConfigCommon:
      - physCellId: 0

        # Frequency
        absoluteFrequencySSB: <NR-ARFCN>         # Must match CU config
        dl_absoluteFrequencyPointA: <NR-ARFCN>    # Must match CU config
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1                    # Group B
        dl_carrierBandwidth: <RBs>                 # Group A
        initialDLBWPlocationAndBandwidth: <val>    # Group A: 275*(L-1)+RBstart
        initialDLBWPsubcarrierSpacing: 1           # Group B
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: <band>
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1                    # Group B
        ul_carrierBandwidth: <RBs>                 # Group A: must equal DL (TDD)
        pMax: 20
        initialULBWPlocationAndBandwidth: <val>    # Group A
        initialULBWPsubcarrierSpacing: 1           # Group B

        # RACH — DU broadcasts these in SIB1 and handles RACH procedure.
        # Must match CU config for consistency (CU uses these for UL grants).
        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10              # Recommended: default 4 too tight for USRP OTA
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1          # Group B
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90

        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90

        ssb_PositionsInBurst_PR: 2         # Group E
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1               # Group B
        referenceSubcarrierSpacing: 1      # Group B

        # TDD pattern — must match CU config exactly.
        # A mismatch between CU and DU TDD patterns causes the UE to receive
        # inconsistent slot structure information from RRC (CU) and SIB1 (DU).
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6             # Group C: DL+UL ≤ 14
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4
        ssPBCH_BlockPower: -25

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    # amf_ip_address: ABSENT [SPLIT-5] — DU does not connect to AMF.
    # NETWORK_INTERFACES: ABSENT [SPLIT-6] — DU has no N2/N3.

# =============================================================================
# SECTION 2: MAC/RLC
# Key change: tr_n_preference is now "f1" instead of "local_RRC". [SPLIT-1]
# This tells the MAC that the RRC/PDCP is accessed via F1 (on the CU).
# F1-U GTP-U transport addresses connect DU to CU for user-plane data.
# =============================================================================
MACRLCs:
  - tr_s_preference: local_L1       # DU has local RF — L1 is local.
    tr_n_preference: f1             # [SPLIT-1] was "local_RRC" in monolithic.
                                    # Group L: must be "f1" on DU, "local_RRC" on CU.

    # F1 transport addresses. [SPLIT-2]
    # local_n: DU side. remote_n: CU side.
    # Group J: these must mirror the CU's local_s/remote_s values exactly.
    local_n_address: <DU_F1_IP>     # Group J: DU-side F1 IP. CU sends F1-U here.
    remote_n_address: <CU_F1_IP>    # Group J: CU-side F1 IP. Must match CU_F1AP_IP_ADDRESS.
    local_n_portc: 500              # DU-side F1-C port. Group J: must match CU remote_s_portc.
    local_n_portd: 2152             # DU-side F1-U port. Group J: must match CU remote_s_portd.
    remote_n_portc: 500             # CU-side F1-C port. Group J: must match CU local_s_portc.
    remote_n_portd: 2152            # CU-side F1-U port. Group J: must match CU local_s_portd.

    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    ul_prbblack_SNR_threshold: 10
    ulsch_max_frame_inactivity: 5
    # SliceConf: ABSENT on DU — NVS scheduler runs on CU, not DU.

# =============================================================================
# SECTION 3: L1
# DU runs the actual L1 (PHY) processing. pusch_proc_threads matters here.
# tr_n_preference must be "local_mac". [Group I]
# =============================================================================
L1s:
  - tr_n_preference: local_mac      # Group I: must match MACRLCs.tr_s_preference = "local_L1"
    prach_dtx_threshold: 120
    pucch0_dtx_threshold: 100
    odfm_offset_divisor: 8
    pusch_proc_threads: 8           # Recommended: set to physical core count on DU host.
                                    # Default (1) is insufficient for 106 PRBs.

# =============================================================================
# SECTION 4: RADIO UNIT
# [SPLIT-8] local_rf = yes — RF is on DU host. Identical to monolithic config.
# sdr_addrs present with clock_source and time_source explicit.
# =============================================================================
RUs:
  - local_rf: yes                   # [SPLIT-8] DU has RF. Must be "yes".
    nb_tx: 1
    nb_rx: 1
    att_tx: 0                       # Group G: 0 for OTA. Non-zero only with physical attenuators.
    att_rx: 0                       # Group G: 0 for OTA. Was 14 in original config — wrong for OTA.
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75                  # Required. 70-80 dB for X310 SBX Band 78.
    eNB_instances: [0]
    sdr_addrs: "addr=<USRP_IP>,clock_source=internal,time_source=internal,send_frame_size=8000,recv_frame_size=8000"
    # clock_source=internal: X310 without external reference.
    # Change to external if OctoClock/GPSDO is connected.

# =============================================================================
# SECTION 5: THREADING
# [SPLIT-9] DU runs real-time PHY — THREAD_STRUCT required.
# Same rules as monolithic: PARALLEL_RU_L1_SPLIT minimum for OTA.
# =============================================================================
THREAD_STRUCT:
  - parallel_config: PARALLEL_RU_L1_SPLIT   # [SPLIT-9] Required for OTA on DU.
    worker_config: WORKER_ENABLE

# =============================================================================
# SECTION 6: SECURITY
# Security (ciphering/integrity) is applied at PDCP on the CU.
# This block on the DU is largely unused but required by OAI's config parser.
# =============================================================================
security:
  ciphering_algorithms: [nea0]
  integrity_algorithms: [nia2, nia0]
  drb_ciphering: yes
  drb_integrity: no

# =============================================================================
# SECTION 7: LOGGING
# F1AP debug: essential on DU for F1 Setup and DRB setup diagnosis.
# PHY/MAC debug: only on DU (CU PHY/MAC logs are stubs).
# NGAP/RRC: not useful on DU — those run on CU.
# =============================================================================
log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info         # debug only for offline RACH/PUSCH diagnosis (verbose OTA)
  mac_log_level: info         # debug only for offline RA/scheduling diagnosis
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info         # not useful on DU — RRC runs on CU
  ngap_log_level: info        # not useful on DU — NGAP runs on CU
  f1ap_log_level: debug       # debug: essential for F1 Setup and DRB setup on DU side
