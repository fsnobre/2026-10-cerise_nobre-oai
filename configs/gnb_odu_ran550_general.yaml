# =============================================================================
# OAI O-DU Configuration — Benetel RAN550 (General Template)
# =============================================================================
# O-DU with 7.2x eCPRI fronthaul toward Benetel RAN550 (outdoor, Band 77/78, 4T4R).
#
# Differences vs RAN650 template:
#   [RAN550-1]  T1a_max_up / T1a_min_up higher (outdoor unit, more fronthaul latency)
#   [RAN550-2]  Ta3_max higher (outdoor propagation + processing latency)
#   [RAN550-3]  ul_frequencyBand may be 77 or 78 (check your RAN550 configuration)
#   [RAN550-4]  ssPBCH_BlockPower likely higher (outdoor TX power)
#   [RAN550-5]  pMax may be higher depending on regulatory / deployment
#
# Everything else is identical to the RAN650 template.
# This file only shows the parameters that differ — for the full template see
# gnb_odu_ran650_general.yaml.
# =============================================================================

Active_gNBs:
  - gnb-odu
Asn1_verbosity: none

gNBs:
  - gNB_ID: <hex>
    gNB_name: gnb-odu-ran550
    tracking_area_code: <TAC>
    nr_cellid: <cellid>

    plmn_list:
      - mcc: <MCC>
        mnc: <MNC>
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0x00001

    min_rxtxtime: 6
    pdsch_AntennaPorts: 4
    pusch_AntennaPorts_XP: 4
    do_SRS: 1
    do_CSIRS: 1

    servingCellConfigCommon:
      - physCellId: 0
        absoluteFrequencySSB: <NR-ARFCN>
        dl_absoluteFrequencyPointA: <NR-ARFCN>
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1
        dl_carrierBandwidth: <RBs>
        initialDLBWPlocationAndBandwidth: <val>
        initialDLBWPsubcarrierSpacing: 1
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0

        # [RAN550-3] Band 77 covers 3300-4200 MHz; Band 78 covers 3300-3800 MHz.
        # Verify your RAN550 unit's configured band — both are supported.
        ul_frequencyBand: 77        # [RAN550-3] Change to 78 if your unit uses Band 78.
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1
        ul_carrierBandwidth: <RBs>
        pMax: 23                    # [RAN550-5] 23 dBm (200 mW) typical for outdoor.
        initialULBWPlocationAndBandwidth: <val>
        initialULBWPsubcarrierSpacing: 1

        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90
        ssb_PositionsInBurst_PR: 2
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1
        referenceSubcarrierSpacing: 1
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4
        ssPBCH_BlockPower: -18      # [RAN550-4] Outdoor unit has higher TX power.

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    amf_ip_address:
      - ipv4: <AMF_IP>

    NETWORK_INTERFACES:
      GNB_INTERFACE_NAME_FOR_NG_AMF: <iface>
      GNB_IPV4_ADDRESS_FOR_NG_AMF: <ODU_N2_IP>
      GNB_INTERFACE_NAME_FOR_NGU: <iface>
      GNB_IPV4_ADDRESS_FOR_NGU: <ODU_N3_IP>
      GNB_PORT_FOR_S1U: 2152

MACRLCs:
  - tr_s_preference: local_L1
    tr_n_preference: local_RRC
    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    ul_prbblack_SNR_threshold: 10
    ulsch_max_frame_inactivity: 5

L1s:
  - tr_n_preference: local_mac
    prach_dtx_threshold: 120
    pucch0_dtx_threshold: 100
    odfm_offset_divisor: 8
    pusch_proc_threads: 8

RUs:
  - local_rf: no
    nb_tx: 4
    nb_rx: 4
    att_tx: 0
    att_rx: 0
    bands: [77]                     # [RAN550-3] Match ul_frequencyBand above.
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75
    eNB_instances: [0]

    ru_config:
      ru_type: oai_oran
      dl_compr_meth: 1              # BFP — same as RAN650
      dl_compr_iq_bitwidth: 9
      ul_compr_meth: 1
      ul_compr_iq_bitwidth: 9
      prach_compr_meth: 1
      prach_compr_iq_bitwidth: 9
      dl_compr_bias_compensation: 0
      ul_compr_bias_compensation: 0

    fh_conf:
      du_addr: <ODU_FH_NIC_MAC>
      ru_addr: <RAN550_MAC>         # RAN550 fronthaul port MAC.
      mtu_size: 9000
      vlan_tag_strip: 0
      io_core: 4
      io_sleep: 0
      io_worker: 1

      # [RAN550-1] [RAN550-2] Timing windows for RAN550 — slightly wider than RAN650
      # to account for outdoor deployment latency and propagation distance.
      # Tune by measuring actual fronthaul latency with tcpdump/Wireshark.
      T1a_max_up: 500               # [RAN550-1] was 430 for RAN650
      T1a_min_up: 285               # [RAN550-1] was 258 for RAN650
      T1a_max_cp_dl: 500            # [RAN550-1]
      T1a_min_cp_dl: 285
      T2a_max_up: 500
      T2a_min_up: 25
      T2a_max_cp_dl: 500
      T2a_min_cp_dl: 25
      Ta3_max: 350                  # [RAN550-2] was 300 for RAN650
      Ta3_min: 25
      T4a_max: 350                  # [RAN550-2]
      T4a_min: 25

THREAD_STRUCT:
  - parallel_config: PARALLEL_RU_L1_TRX_SPLIT
    worker_config: WORKER_ENABLE

security:
  ciphering_algorithms: [nea0]
  integrity_algorithms: [nia2, nia0]
  drb_ciphering: yes
  drb_integrity: no

log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: debug
  f1ap_log_level: info
