# =============================================================================
# OAI gNB CU (Combined CU-CP + CU-UP) Configuration — General Template
# =============================================================================
# This is the CU side of an F1-split gNB deployment.
# The CU owns: RRC, PDCP, SDAP, MAC scheduler (in split), N2, N3.
# The CU does NOT own: PHY, RF, real-time processing (those are on the DU).
#
# Key differences from monolithic gNB config:
#   [SPLIT-1]  MACRLCs.tr_s_preference = "f1"        (was "local_L1")
#   [SPLIT-2]  F1 address parameters added to MACRLCs
#   [SPLIT-3]  F1AP block added (CU_F1AP_IP_ADDRESS)
#   [SPLIT-4]  RUs.local_rf = no  (CU has no RF)
#   [SPLIT-5]  No sdr_addrs (no USRP on CU host)
#   [SPLIT-6]  THREAD_STRUCT not needed (no real-time PHY on CU)
#   [SPLIT-7]  tracking_area_code and amf_ip_address remain on CU
#              (DU has neither — DU does not connect to AMF)
#
# Launch order: start CU first, then DU.
# CU must be listening on F1AP port before DU starts.
# =============================================================================

Active_gNBs:
  - gnb-cu
Asn1_verbosity: none

# =============================================================================
# SECTION 1: gNB IDENTITY
# Both gNB_ID and nr_cellid MUST be identical in CU and DU configs.
# gNB_DU_ID is absent here — it lives only in the DU config.
# =============================================================================
gNBs:
  - gNB_ID: 0xe00             # 20-bit identifier. Must match DU config exactly.
    gNB_name: gnb-cu           # Human-readable name for this CU.
    tracking_area_code: 1      # TAC — lives on CU (DU has no AMF connection).
    nr_cellid: 12345678        # 36-bit NR Cell Identity. Must match DU config.

    plmn_list:                 # Must match DU config exactly.
      - mcc: 001
        mnc: 01
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0x00001

    # -------------------------------------------------------------------------
    # Cell physical parameters — required on CU for RRC configuration generation.
    # These values are sent to the UE via RRC. They must match what the DU
    # broadcasts in SIB1 (DU config servingCellConfigCommon).
    # -------------------------------------------------------------------------
    min_rxtxtime: 6
    do_SRS: 1
    do_CSIRS: 1
    pdsch_AntennaPorts: 1
    pusch_AntennaPorts_XP: 1

    servingCellConfigCommon:
      - physCellId: 0

        # Frequency — must match DU config values exactly
        absoluteFrequencySSB: <NR-ARFCN>        # e.g. 640704 for 3319 MHz (Band 78)
        dl_absoluteFrequencyPointA: <NR-ARFCN>   # e.g. 639996
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1                   # Group B: all SCS fields must match
        dl_carrierBandwidth: <RBs>                # Group A: must match locationAndBandwidth
        initialDLBWPlocationAndBandwidth: <val>   # Group A: 275*(L-1)+RBstart
        initialDLBWPsubcarrierSpacing: 1          # Group B
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: <band>                  # e.g. 78
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1                   # Group B
        ul_carrierBandwidth: <RBs>                # Group A: must equal dl_carrierBandwidth (TDD)
        pMax: 20
        initialULBWPlocationAndBandwidth: <val>   # Group A: must match dl value (TDD)
        initialULBWPsubcarrierSpacing: 1          # Group B

        # RACH — DU broadcasts these in SIB1; must be consistent with DU config
        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10              # Recommended: default 4 too tight for USRP OTA
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1          # Group B: must match dl_subcarrierSpacing
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90

        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90

        ssb_PositionsInBurst_PR: 2         # Group E: 2 for FR1 3-6 GHz (Band 78)
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1               # Group B: must match dl_subcarrierSpacing
        referenceSubcarrierSpacing: 1      # Group B: must match dl_subcarrierSpacing

        # TDD pattern — must match DU config exactly
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6             # Group C: DL+UL ≤ 14
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4               # Group C: 7+1+2=10 slots ✓
        ssPBCH_BlockPower: -25             # Group G: should reflect actual TX power

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    # AMF connectivity — CU side only. Absent from DU config.
    amf_ip_address:
      - ipv4: <AMF_IP>

    NETWORK_INTERFACES:
      GNB_INTERFACE_NAME_FOR_NG_AMF: <iface>     # Recommended: explicit, not auto-detected
      GNB_IPV4_ADDRESS_FOR_NG_AMF: <CU_N2_IP>
      GNB_INTERFACE_NAME_FOR_NGU: <iface>         # Recommended: explicit
      GNB_IPV4_ADDRESS_FOR_NGU: <CU_N3_IP>
      GNB_PORT_FOR_S1U: 2152

# =============================================================================
# SECTION 2: F1AP BLOCK
# Defines where the CU listens for incoming DU connections.
# The DU will initiate F1 Setup by connecting to CU_F1AP_IP_ADDRESS:CU_PORT.
# =============================================================================
F1AP:
  CU_F1AP_IP_ADDRESS: <CU_F1_IP>   # IP on which CU listens for F1AP SCTP from DU.
  CU_PORT: 38472                    # Standard F1AP port (3GPP TS 38.472). Change only if conflicting.

# =============================================================================
# SECTION 3: MAC/RLC
# Key change: tr_s_preference is now "f1" instead of "local_L1".
# This tells the MAC that the L1/PHY is accessed via the F1 interface (DU).
# =============================================================================
MACRLCs:
  - tr_s_preference: f1             # [SPLIT-1] was "local_L1" in monolithic
    tr_n_preference: local_RRC

    # F1 user-plane transport addresses.
    # [SPLIT-2] These are new compared to monolithic config.
    # F1-C (control): carries F1AP messages (maps to CU_F1AP_IP_ADDRESS above).
    # F1-U (user):    carries GTP-U DRB data between CU and DU.
    # Both use separate SCTP/UDP connections even though they share port 2152.
    local_s_address: <CU_F1_IP>     # Group J: CU-side F1 IP. DU must reach this.
    remote_s_address: <DU_F1_IP>    # Group J: DU-side F1 IP. CU sends F1-U here.
    local_s_portc: 500              # F1-C port on CU side.
    local_s_portd: 2152             # F1-U port on CU side.
    remote_s_portc: 500             # F1-C port on DU side. Group J: must match DU local_n_portc.
    remote_s_portd: 2152            # F1-U port on DU side. Group J: must match DU local_n_portd.

    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    ul_prbblack_SNR_threshold: 10
    ulsch_max_frame_inactivity: 5
    # SliceConf: "/path/to/rrmPolicy.json"   # ORANSlice: NVS scheduler runs on CU

# =============================================================================
# SECTION 4: L1
# On the CU, L1 is a stub — actual L1 processing runs on the DU.
# tr_n_preference must still be "local_mac" here; the MAC-to-L1 path
# on the CU side is a passthrough to the F1 transport.
# =============================================================================
L1s:
  - tr_n_preference: local_mac      # Group I: must match MACRLCs.tr_s_preference logic
    prach_dtx_threshold: 120
    pucch0_dtx_threshold: 100
    odfm_offset_divisor: 8
    # pusch_proc_threads not needed on CU — LDPC decoding runs on DU

# =============================================================================
# SECTION 5: RADIO UNIT
# [SPLIT-4] local_rf = no — CU has no radio hardware.
# The RF frontend is on the DU host (WS-gnb2).
# No sdr_addrs needed on CU. [SPLIT-5]
# =============================================================================
RUs:
  - local_rf: no                    # [SPLIT-4] CU has no RF. Must be "no" or OAI crashes.
    nb_tx: 1
    nb_rx: 1
    att_tx: 0
    att_rx: 0
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75
    eNB_instances: [0]
    # sdr_addrs: ABSENT [SPLIT-5] — no USRP on CU host

# =============================================================================
# SECTION 6: THREADING
# [SPLIT-6] CU does not run real-time PHY.
# PARALLEL_SINGLE_THREAD is acceptable on the CU.
# Real-time threading constraints live entirely on the DU.
# =============================================================================
THREAD_STRUCT:
  - parallel_config: PARALLEL_SINGLE_THREAD   # CU: no real-time PHY, this is fine
    worker_config: WORKER_ENABLE

# =============================================================================
# SECTION 7: SECURITY
# Ciphering and integrity are applied at the PDCP layer, which runs on the CU.
# =============================================================================
security:
  ciphering_algorithms: [nea0]      # nea0 = null (lab). Use nea2 for production.
  integrity_algorithms: [nia2, nia0]
  drb_ciphering: yes
  drb_integrity: no

# =============================================================================
# SECTION 8: LOGGING
# F1AP debug is essential for diagnosing F1 Setup and DRB setup failures.
# NGAP/RRC debug for UE registration issues (same as monolithic).
# PHY/MAC debug not applicable on CU — those run on DU.
# =============================================================================
log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: debug    # debug: useful for N2 setup and UE registration
  f1ap_log_level: debug    # debug: essential for F1 Setup and DRB setup diagnosis
