# =============================================================================
# OAI gNB DU Configuration — Testbed Specific
# =============================================================================
# Host:        WS-gnb2 (192.168.80.2 on F1 link, 192.168.40.2 USRP NIC)
# F1 toward:   WS-gnb1 (CU) at 192.168.80.1
# RF:          USRP X310 at 192.168.40.2 (10 GbE, XG FPGA image)
# Band:        78 · 40 MHz · 30 kHz SCS · 106 PRB
# No AMF/UPF connection — those are on the CU (WS-gnb1)
# =============================================================================

Active_gNBs:
  - gnb-du
Asn1_verbosity: none

gNBs:
  - gNB_ID: 0xe00               # Group K: must match CU config exactly
    gNB_DU_ID: 1                # Required in split mode. Unique per DU. Absent in monolithic.
    gNB_DU_name: du-ws-gnb2
    gNB_name: gnb-du
    # tracking_area_code: ABSENT — DU has no AMF connection
    nr_cellid: 12345678          # Group K: must match CU config exactly

    plmn_list:                   # Group K: must match CU config exactly
      - mcc: 001
        mnc: 01
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0x00001
          - sst: 1
            sd: 0x000002

    min_rxtxtime: 6              # 6 for 10GbE X310 (XG FPGA image). Use 8 for 1GbE (HG).
    do_SRS: 1
    do_CSIRS: 1
    pdsch_AntennaPorts: 1
    pusch_AntennaPorts_XP: 1

    servingCellConfigCommon:
      - physCellId: 0
        absoluteFrequencySSB: 640704
        dl_absoluteFrequencyPointA: 639996
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1
        dl_carrierBandwidth: 106            # Group A: matches locationAndBandwidth=28875
        initialDLBWPlocationAndBandwidth: 28875
        initialDLBWPsubcarrierSpacing: 1    # Group B
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: 78
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1             # Group B
        ul_carrierBandwidth: 106            # Group A
        pMax: 20
        initialULBWPlocationAndBandwidth: 28875
        initialULBWPsubcarrierSpacing: 1    # Group B
        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10               # Recommended: default 4 too tight for X310 OTA
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1           # Group B
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90
        ssb_PositionsInBurst_PR: 2          # Group E: Band 78
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1                # Group B
        referenceSubcarrierSpacing: 1       # Group B
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4
        ssPBCH_BlockPower: -25

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    # amf_ip_address: ABSENT — DU has no AMF/N2 connection
    # NETWORK_INTERFACES: ABSENT — DU has no N2/N3

# =============================================================================
# MACRLCs: tr_n_preference = "f1" connects DU MAC to CU via F1 interface.
# F1 addresses: Group J — must mirror CU MACRLCs local_s/remote_s exactly.
# =============================================================================
MACRLCs:
  - tr_s_preference: local_L1       # DU has local RF
    tr_n_preference: f1             # [SPLIT-1] F1 toward CU on WS-gnb1

    # Group J: these must mirror CU MACRLCs values
    # CU local_s_address=192.168.80.1 → this remote_n_address
    # CU remote_s_address=192.168.80.2 → this local_n_address
    local_n_address: 192.168.80.2   # DU F1 link NIC (WS-gnb2). Group J.
    remote_n_address: 192.168.80.1  # CU F1 link NIC (WS-gnb1). Must match CU_F1AP_IP_ADDRESS.
    local_n_portc: 500              # Group J: must match CU remote_s_portc
    local_n_portd: 2152             # Group J: must match CU remote_s_portd
    remote_n_portc: 500             # Group J: must match CU local_s_portc
    remote_n_portd: 2152            # Group J: must match CU local_s_portd

    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    ul_prbblack_SNR_threshold: 10
    ulsch_max_frame_inactivity: 5
    # SliceConf: ABSENT — NVS scheduler runs on CU, not DU

L1s:
  - tr_n_preference: local_mac      # Group I: DU has local L1
    prach_dtx_threshold: 120
    pucch0_dtx_threshold: 100
    odfm_offset_divisor: 8
    pusch_proc_threads: 8           # Set to physical core count on WS-gnb2

# =============================================================================
# RUs: USRP X310 on WS-gnb2.
# Identical to monolithic config — RF is on DU.
# =============================================================================
RUs:
  - local_rf: yes                   # [SPLIT-8] RF is local to DU
    nb_tx: 1
    nb_rx: 1
    att_tx: 0                       # Group G: 0 for OTA
    att_rx: 0                       # Group G: 0 for OTA
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75
    eNB_instances: [0]
    sdr_addrs: "addr=192.168.40.2,clock_source=internal,time_source=internal,send_frame_size=8000,recv_frame_size=8000"

# =============================================================================
# Threading: required on DU — real-time PHY runs here.
# =============================================================================
THREAD_STRUCT:
  - parallel_config: PARALLEL_RU_L1_SPLIT   # Required for OTA on DU
    worker_config: WORKER_ENABLE

security:
  ciphering_algorithms: [nea0]
  integrity_algorithms: [nia2, nia0]
  drb_ciphering: yes
  drb_integrity: no

log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: info        # not useful on DU
  f1ap_log_level: debug       # debug: essential for F1 Setup diagnosis on DU
