# =============================================================================
# OAI O-DU Configuration — Benetel RAN650 (General Template)
# =============================================================================
# O-DU with 7.2x eCPRI fronthaul toward Benetel RAN650 (indoor, Band 78, 4T4R).
# Monolithic O-DU: full stack RRC through Upper PHY on one host.
#
# Key differences from USRP monolithic config:
#   [ORAN-1]  local_rf = no          (RF is on O-RU, not O-DU host)
#   [ORAN-2]  sdr_addrs ABSENT       (no USRP on O-DU host)
#   [ORAN-3]  ru_type = oai_oran     (7.2x eCPRI fronthaul)
#   [ORAN-4]  nb_tx/nb_rx = 4        (Benetel RAN650 is 4T4R)
#   [ORAN-5]  pdsch/pusch_AntennaPorts = 4
#   [ORAN-6]  ru_config block added  (compression: BFP, 9-bit)
#   [ORAN-7]  fh_conf block added    (MAC addresses, timing windows)
#   [ORAN-8]  PARALLEL_RU_L1_TRX_SPLIT required (not SPLIT)
#   [ORAN-9]  No --usrp-tx-thread-config in launch command
#
# Prerequisites:
#   - ptp4l running and LOCKED on fronthaul NIC before starting nr-softmodem
#   - phc2sys syncing system clock to PTP hardware clock
#   - Fronthaul NIC MTU = 9000, GRO/LRO/TSO/GSO off
#   - Benetel PTP locked and cell active
# =============================================================================

Active_gNBs:
  - gnb-odu
Asn1_verbosity: none

gNBs:
  - gNB_ID: <hex>               # 20-bit gNB identifier. Must match AMF config.
    gNB_name: gnb-odu
    tracking_area_code: <TAC>   # Must match AMF TAC.
    nr_cellid: <cellid>         # 36-bit NR Cell Identity.

    plmn_list:
      - mcc: <MCC>
        mnc: <MNC>
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0x00001

    min_rxtxtime: 6

    # [ORAN-5] 4T4R for Benetel RAN650.
    # Group O: pdsch_AntennaPorts must equal nb_tx; pusch must equal nb_rx.
    pdsch_AntennaPorts: 4           # [ORAN-5] was 1 for USRP SISO
    pusch_AntennaPorts_XP: 4        # [ORAN-5] was 1 for USRP SISO

    do_SRS: 1
    do_CSIRS: 1

    servingCellConfigCommon:
      - physCellId: 0               # Must match Benetel cell ID configuration.

        # Frequency — must match Benetel RF configuration exactly.
        # Benetel must be set to the same ARFCN via its management interface.
        absoluteFrequencySSB: <NR-ARFCN>
        dl_absoluteFrequencyPointA: <NR-ARFCN>
        dl_offstToCarrier: 0
        dl_subcarrierSpacing: 1     # Group B: 30 kHz
        dl_carrierBandwidth: <RBs>  # Group A: e.g. 106 for 40 MHz
        initialDLBWPlocationAndBandwidth: <val>   # Group A: 275*(L-1)+RBstart
        initialDLBWPsubcarrierSpacing: 1          # Group B
        initialDLBWPcontrolResourceSetZero: 12
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: <band>
        ul_offstToCarrier: 0
        ul_subcarrierSpacing: 1     # Group B
        ul_carrierBandwidth: <RBs>  # Group A
        pMax: 20
        initialULBWPlocationAndBandwidth: <val>   # Group A
        initialULBWPsubcarrierSpacing: 1          # Group B

        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        preambleTransMax: 6
        powerRampingStep: 1
        ra_ResponseWindow: 10
        ra_ContentionResolutionTimer: 7
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1   # Group B
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90
        ssb_PositionsInBurst_PR: 2  # Group E: Band 78 = FR1 3-6 GHz
        ssb_PositionsInBurst_Bitmap: 1
        ssb_periodicityServingCell: 2
        dmrs_TypeA_Position: 0
        subcarrierSpacing: 1        # Group B
        referenceSubcarrierSpacing: 1  # Group B
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6      # Group C
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4
        ssPBCH_BlockPower: -25

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    amf_ip_address:
      - ipv4: <AMF_IP>

    NETWORK_INTERFACES:
      GNB_INTERFACE_NAME_FOR_NG_AMF: <iface>
      GNB_IPV4_ADDRESS_FOR_NG_AMF: <ODU_N2_IP>
      GNB_INTERFACE_NAME_FOR_NGU: <iface>
      GNB_IPV4_ADDRESS_FOR_NGU: <ODU_N3_IP>
      GNB_PORT_FOR_S1U: 2152

MACRLCs:
  - tr_s_preference: local_L1
    tr_n_preference: local_RRC
    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    ul_prbblack_SNR_threshold: 10
    ulsch_max_frame_inactivity: 5

L1s:
  - tr_n_preference: local_mac
    prach_dtx_threshold: 120
    pucch0_dtx_threshold: 100
    odfm_offset_divisor: 8
    pusch_proc_threads: 8           # 4T4R increases PUSCH load — use at least 8 threads.

# =============================================================================
# RADIO UNIT — O-RAN 7.2x Fronthaul
# This is the core change from USRP config.
# =============================================================================
RUs:
  - local_rf: no                    # [ORAN-1] RF is on O-RU. Must be "no".
    nb_tx: 4                        # [ORAN-4] Benetel RAN650 is 4T4R.
    nb_rx: 4                        # [ORAN-4]
    att_tx: 0
    att_rx: 0
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75                  # Used as AGC reference even in fronthaul mode.
    eNB_instances: [0]
    # sdr_addrs: ABSENT [ORAN-2] — no USRP on O-DU host

    # -------------------------------------------------------------------------
    # ru_config: fronthaul transport type and IQ compression.
    # [ORAN-3] [ORAN-6]
    # -------------------------------------------------------------------------
    ru_config:
      ru_type: oai_oran             # [ORAN-3] 7.2x eCPRI fronthaul. Not oai_usrp.

      # IQ compression — Group M: must match O-RU (Benetel) configuration exactly.
      # Mismatch causes IQ corruption — radio appears to work but UEs cannot decode.
      # Benetel RAN650: BFP (method=1), 9-bit IQ width.
      dl_compr_meth: 1              # 0=none, 1=BFP (Block Floating Point)
      dl_compr_iq_bitwidth: 9       # Compressed IQ bit width. Benetel: 9.
      ul_compr_meth: 1              # Must match Benetel UL compression config.
      ul_compr_iq_bitwidth: 9       # Must match Benetel UL IQ bit width.
      prach_compr_meth: 1           # PRACH compression. Some O-RUs differ from UL.
      prach_compr_iq_bitwidth: 9
      dl_compr_bias_compensation: 0 # BFP bias correction. Try 1 if DL IQ quality poor.
      ul_compr_bias_compensation: 0 # BFP bias correction for UL.

    # -------------------------------------------------------------------------
    # fh_conf: fronthaul network topology and timing windows.
    # [ORAN-7]
    # -------------------------------------------------------------------------
    fh_conf:
      # MAC addresses — Group N: must be exact hardware MAC addresses.
      # Wrong MAC → eCPRI frames silently dropped at NIC/switch level.
      # Get O-DU MAC:  ip link show <fh_iface> | grep ether
      # Get O-RU MAC:  label on Benetel unit, or arping -I <fh_iface> <benetel_ip>
      du_addr: <ODU_FH_NIC_MAC>     # Group N: O-DU fronthaul NIC MAC. e.g. aa:bb:cc:dd:ee:ff
      ru_addr: <BENETEL_MAC>        # Group N: Benetel RAN650 fronthaul port MAC.

      mtu_size: 9000                # Group Q: must match NIC MTU and switch port MTU.
                                    # Set NIC: ip link set <fh_iface> mtu 9000

      vlan_tag_strip: 0             # 0=no stripping, 1=strip VLAN tag on ingress.
                                    # Set to 1 if Benetel sends VLAN-tagged eCPRI frames.

      io_core: 4                    # CPU core for fronthaul I/O thread.
                                    # Pin to an isolated core NOT in --thread-pool.
      io_sleep: 0                   # I/O thread sleep between polls (µs).
                                    # 0=busy-poll (lowest latency). Recommended for O-RAN.
      io_worker: 1                  # Number of fronthaul I/O worker threads.

      # Timing windows (µs) — O-RAN WG4 CUS-Plane spec Section 4.3.
      # These define valid time windows for C-Plane and U-Plane message delivery.
      # Values below are tuned for Benetel RAN650 with direct cable / single switch hop.
      # Increase T1a_max_up and T2a_max_up if [FH] Timing violation appears in logs.
      #
      # Measurement guidance:
      #   Run: sudo tcpdump -ni <fh_iface> ether proto 0xAEFE -w /tmp/fh.pcap
      #   Analyze in Wireshark (O-RAN FH protocol dissector) to measure actual latency.
      T1a_max_up: 430               # Max µs O-DU sends DL U-Plane before symbol start.
      T1a_min_up: 258               # Min µs. Must be > one-way fronthaul latency.
      T1a_max_cp_dl: 430            # Max µs O-DU sends DL C-Plane before symbol.
      T1a_min_cp_dl: 285            # Min µs for DL C-Plane.
      T2a_max_up: 430               # Max µs O-RU receives DL U-Plane before processing.
      T2a_min_up: 25                # Min µs.
      T2a_max_cp_dl: 430            # Max µs O-RU receives DL C-Plane.
      T2a_min_cp_dl: 25             # Min µs.
      Ta3_max: 300                  # Max µs O-RU sends UL U-Plane after symbol end.
      Ta3_min: 25                   # Min µs.
      T4a_max: 300                  # Max µs O-DU receives UL U-Plane.
      T4a_min: 25                   # Min µs.

# =============================================================================
# THREADING
# [ORAN-8] PARALLEL_RU_L1_TRX_SPLIT required for O-RAN fronthaul.
# The TRX split separates fronthaul TX and RX threads from L1 processing,
# which is critical for meeting eCPRI timing deadlines.
# PARALLEL_RU_L1_SPLIT may work for light testing but risks timing violations.
# =============================================================================
THREAD_STRUCT:
  - parallel_config: PARALLEL_RU_L1_TRX_SPLIT   # [ORAN-8] Required for O-RAN OTA.
    worker_config: WORKER_ENABLE

security:
  ciphering_algorithms: [nea0]
  integrity_algorithms: [nia2, nia0]
  drb_ciphering: yes
  drb_integrity: no

log_config:
  global_log_level: info
  hw_log_level: info              # debug: shows FH timing events and eCPRI frame stats
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: debug
  f1ap_log_level: info
