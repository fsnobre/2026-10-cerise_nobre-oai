# =============================================================================
# ORANSlice gNB Configuration — RFsim (Software Radio Simulation)
# =============================================================================
# Derived from gnb_annotated.conf (OTA config). Changes from OTA are marked
# with [RFSIM-N] tags. All other parameters are identical to the OTA file.
#
# Launch:
#   sudo ./nr-softmodem -O gnb_rfsim.conf --sa --rfsim
#
# See gnb_rfsim.yaml for full comments. This .conf is for ORANSlice builds
# that do not support YAML. Both files contain the same values.
# =============================================================================

Active_gNBs = ( "gnb" );
Asn1_verbosity = "none";

gNBs =
(
  {
    gNB_ID = 0xe00;
    gNB_name = "gnb";
    tracking_area_code = 1;

    plmn_list = (
      {
        mcc = 001;
        mnc = 01;
        mnc_length = 2;
        snssaiList = (
          { sst = 1; sd = 0x00001; },
          { sst = 1; sd = 0x000002; }
        );
      }
    );

    nr_cellid = 12345678L;

    # [RFSIM-1] Keep OTA value — validates same timing parameter.
    min_rxtxtime = 6;

    do_SRS    = 1;
    do_CSIRS  = 1;
    pdsch_AntennaPorts_XP = 1;
    pusch_AntennaPorts    = 1;

    servingCellConfigCommon = (
    {
      physCellId = 0;

      absoluteFrequencySSB          = 640704;
      dl_absoluteFrequencyPointA    = 639996;
      dl_offstToCarrier             = 0;
      dl_subcarrierSpacing          = 1;
      dl_carrierBandwidth           = 106;
      initialDLBWPlocationAndBandwidth  = 28875;
      initialDLBWPsubcarrierSpacing     = 1;
      initialDLBWPcontrolResourceSetZero = 12;
      initialDLBWPsearchSpaceZero        = 0;

      ul_frequencyBand              = 78;
      ul_offstToCarrier             = 0;
      ul_subcarrierSpacing          = 1;
      ul_carrierBandwidth           = 106;
      pMax                          = 20;
      initialULBWPlocationAndBandwidth  = 28875;
      initialULBWPsubcarrierSpacing     = 1;

      prach_ConfigurationIndex      = 98;
      prach_msg1_FDM                = 0;
      prach_msg1_FrequencyStart     = 0;
      zeroCorrelationZoneConfig     = 13;
      preambleReceivedTargetPower   = -96;
      preambleTransMax              = 6;
      powerRampingStep              = 1;
      ra_ResponseWindow             = 4;
      ra_ContentionResolutionTimer  = 7;
      rsrp_ThresholdSSB             = 19;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB    = 14;
      prach_RootSequenceIndex_PR    = 2;
      prach_RootSequenceIndex       = 1;
      msg1_SubcarrierSpacing        = 1;
      restrictedSetConfig           = 0;
      msg3_DeltaPreamble            = 1;
      p0_NominalWithGrant           = -90;

      pucchGroupHopping             = 0;
      hoppingId                     = 40;
      p0_nominal                    = -90;

      ssb_PositionsInBurst_Bitmap   = 1;
      ssb_PositionsInBurst_PR       = 2;
      ssb_periodicityServingCell    = 2;
      dmrs_TypeA_Position           = 0;
      subcarrierSpacing             = 1;
      referenceSubcarrierSpacing    = 1;

      dl_UL_TransmissionPeriodicity = 6;
      nrofDownlinkSlots             = 7;
      nrofDownlinkSymbols           = 6;
      nrofUplinkSlots               = 2;
      nrofUplinkSymbols             = 4;
      ssPBCH_BlockPower             = -25;
    }
    );

    SCTP :
    {
      SCTP_INSTREAMS  = 2;
      SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ( { ipv4 = "192.168.70.132"; } );

    NETWORK_INTERFACES :
    {
      GNB_INTERFACE_NAME_FOR_NG_AMF = "demo-oai";
      GNB_IPV4_ADDRESS_FOR_NG_AMF   = "192.168.70.129/24";
      GNB_INTERFACE_NAME_FOR_NGU    = "demo-oai";
      GNB_IPV4_ADDRESS_FOR_NGU      = "192.168.70.129/24";
      GNB_PORT_FOR_S1U              = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc         = 1;
  tr_s_preference = "local_L1";
  tr_n_preference = "local_RRC";
  pusch_TargetSNRx10          = 200;
  pucch_TargetSNRx10          = 200;
  ul_prbblack_SNR_threshold   = 10;

  # [RFSIM-2] 500 frames tolerance — rfsim UE may be slower than real UE.
  ulsch_max_frame_inactivity  = 500;   # OTA value: 5

  SliceConf = "/home/nobre/oranslice2/ORANSlice/rrmPolicy.json";
}
);

L1s = (
{
  num_cc               = 1;
  tr_n_preference       = "local_mac";
  prach_dtx_threshold   = 120;
  pucch0_dtx_threshold  = 100;
  odfm_offset_divisor   = 8;

  # [RFSIM-3] 1 thread sufficient for rfsim — no real-time pressure.
  pusch_proc_threads    = 1;    # OTA value: 8
}
);

RUs = (
{
  local_rf    = "yes";
  nb_tx       = 1;
  nb_rx       = 1;
  att_tx      = 0;
  att_rx      = 0;
  bands       = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain  = 75;   # not used by rfsim; kept for config parity
  eNB_instances = [0];

  # [RFSIM-4] rfsim loopback address. OTA value: "type=x300,addr=192.168.40.2,..."
  sdr_addrs = "tcp_server_addr=127.0.0.1";
}
);

# [RFSIM-5] PARALLEL_SINGLE_THREAD correct for rfsim.
THREAD_STRUCT = (
{
  parallel_config = "PARALLEL_SINGLE_THREAD";   # OTA value: PARALLEL_RU_L1_SPLIT
  worker_config   = "WORKER_ENABLE";
}
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity  = "no";
};

# [RFSIM-6] mac/rlc elevated to debug — safe in rfsim (no real-time).
log_config : {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "debug";   # OTA value: info
  rlc_log_level    = "debug";   # OTA value: info
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "debug";
  f1ap_log_level   = "debug";
};
